<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unidesk | Campus Helpdesk &amp; Operations</title>
  <meta name="description" content="Report, track and resolve campus issues with clarity, speed and impact.">

  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://unpkg.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://accounts.google.com https://*.google.com;">

  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#a3ff12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Unidesk">
  <link rel="manifest" href="manifest.json">

  <!-- OpenGraph & Social Sharing Meta Tags -->
  <meta property="og:title" content="Unidesk | Next-Gen Campus Operations &amp; Helpdesk">
  <meta property="og:description" content="Report, track and resolve campus issues with clarity, speed and impact.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Unidesk | Next-Gen Campus Operations &amp; Helpdesk">
  <meta name="twitter:description" content="Report, track and resolve campus issues with clarity, speed and impact.">
  <meta name="twitter:image" content="logo.png">

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="logo-icon.svg">
  <link rel="alternate icon" type="image/png" href="logo-icon.png">
  <link rel="apple-touch-icon" href="logo-icon.png">

  <!-- Fonts & Stylesheet (Vite/Tailwind Purged CSS + Zen Design System) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Vendor Libraries: Pinned Lucide Icons, DOMPurify Sanitizer & Supabase Client SDK -->
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.3/purify.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2.48.1/dist/umd/supabase.js"></script>
</head>

<body class="zen font-sans text-gray-100 antialiased">

  <header class="sticky top-0 z-40 bg-[#080a07]/80 backdrop-blur-xl border-b border-white/10 transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-18 flex items-center justify-between gap-4 py-3">
      <a href="#/" class="flex items-center gap-3 group transition-transform hover:scale-[1.02]"
        aria-label="Unidesk Home">
        <img id="header-logo" src="logo-white.svg" alt="Unidesk"
          class="h-9 sm:h-10 w-auto object-contain drop-shadow-[0_2px_12px_rgba(163,255,18,0.25)]">
      </a>
      <nav id="nav" class="hidden md:flex items-center gap-1.5"></nav>
      <div class="flex items-center gap-2.5">
        <span
          class="hidden lg:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-mono bg-white/5 border border-white/10 text-gray-400">
          <kbd class="text-[#a3ff12] font-semibold">/</kbd> search <span class="text-gray-400">·</span> <kbd
            class="text-[#a3ff12] font-semibold">N</kbd> report
        </span>
        <div id="auth-nav-slot"></div>
        <button id="theme-toggle-btn" type="button" data-action="toggle-theme"
          class="w-9 h-9 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-gray-300 hover:text-[#a3ff12] transition-colors focus:outline-none focus:ring-2 focus:ring-[#a3ff12]"
          title="Toggle Light / Dark mode" aria-label="Toggle theme mode">
          <i id="theme-icon" data-lucide="sun" class="w-4 h-4 text-[#a3ff12]"></i>
        </button>
        <a href="#/report" class="btn-primary !py-2 !px-4 text-sm"><i data-lucide="plus"
            class="w-4 h-4 stroke-[2.5]"></i><span>New Request</span></a>
      </div>
    </div>
  </header>

  <main id="app" class="min-h-[75vh]"></main>

  <footer class="border-t border-white/10 mt-16 bg-[#080a07]/90 relative overflow-hidden">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-12 grid gap-8 md:grid-cols-3 text-sm text-gray-400">
      <div>
        <a href="#/" class="inline-block mb-3">
          <img id="footer-logo" src="logo-white.svg" alt="Unidesk" class="h-8 w-auto object-contain">
        </a>
        <p class="text-gray-400 max-w-sm leading-relaxed">One place to report, track and resolve campus issues with
          clarity, speed and impact.</p>
      </div>
      <div class="flex flex-col gap-2">
        <div class="font-bold text-xs uppercase tracking-wider mb-1 text-[#a3ff12] font-mono">// Navigation</div>
        <a class="hover:text-[#a3ff12] transition-colors" href="#/requests">All Requests</a>
        <a class="hover:text-[#a3ff12] transition-colors" href="#/help">Knowledge Base</a>
        <a class="hover:text-[#a3ff12] transition-colors" href="#/directory">Directory &amp; Emergency</a>
      </div>
      <div class="flex flex-col gap-2">
        <div class="font-bold text-xs uppercase tracking-wider mb-1 text-[#a3ff12] font-mono">// Management</div>
        <a class="hover:text-[#a3ff12] transition-colors" href="#/login">Login / Supabase Account</a>
        <a class="hover:text-[#a3ff12] transition-colors" href="#/staff">Staff Portal</a>
        <button type="button" class="text-left hover:text-[#a3ff12] transition-colors" data-action="add-demo">+ Add demo tickets</button>
        <button type="button" class="text-left hover:text-[#a3ff12] transition-colors" data-action="reset-demo">Reset demo data</button>
      </div>
    </div>
  </footer>

  <nav id="tabbar"
    class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-[#080a07]/90 backdrop-blur-xl border-t border-white/10 flex">
  </nav>

  <div id="toast"
    role="status"
    aria-live="polite"
    class="fixed top-20 right-4 z-50 opacity-0 pointer-events-none -translate-y-2 transition-all duration-300 bg-[#0e140d]/90 backdrop-blur-xl border border-[#a3ff12]/40 rounded-2xl px-5 py-3 text-sm font-semibold shadow-[0_12px_40px_rgba(0,0,0,0.6)] flex items-center gap-2.5 text-white">
    <i data-lucide="check-circle-2" class="w-4 h-4 text-[#a3ff12]"></i><span id="toast-msg"></span>
  </div>

  <!-- Image Lightbox Modal with Keyboard Focus Trapping -->
  <div id="img-modal"
    role="dialog"
    aria-modal="true"
    aria-label="Enlarged attachment preview"
    tabindex="-1"
    class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4 cursor-pointer"
    data-action="close-modal">
    <div class="relative max-w-4xl max-h-[90vh] p-2" data-modal-content="true">
      <button
        id="img-modal-close"
        type="button"
        aria-label="Close image preview"
        data-action="close-modal"
        class="absolute -top-3 -right-3 w-9 h-9 rounded-full bg-[#0c0f0a] border border-white/20 text-white flex items-center justify-center hover:text-[#a3ff12] focus:outline-none focus:ring-2 focus:ring-[#a3ff12] shadow-lg">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <img id="img-modal-src" src="" alt="Enlarged attachment"
        class="rounded-2xl max-w-full max-h-[85vh] object-contain border border-white/20 shadow-2xl">
    </div>
  </div>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-[9999] hidden"></canvas>

  <script src="app.js"></script>
</body>

</html>
